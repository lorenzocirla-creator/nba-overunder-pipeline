name: NBA totali

# Lo fa partire il timer Cloudflare (lo stesso del progetto Dunkest):
#   - mattina, 10:30: pipeline completa, messaggio Telegram, consuntivo di ieri
#   - sera, 2 ore prima della prima partita: linee aggiornate, avviso solo se si sono mosse
# L'esecuzione programmata qui sotto è solo una riserva (GitHub la fa partire in ritardo).
on:
  workflow_dispatch:
    inputs:
      modalita:
        description: "mattina oppure sera"
        required: false
        default: "mattina"
      forza:
        description: "esegui anche se già completata oggi"
        required: false
        default: "no"
  schedule:
    - cron: "45 9 * * *"

permissions:
  contents: write

jobs:
  totali:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Esegui
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODALITA: ${{ inputs.modalita || 'mattina' }}
          FORZA: ${{ inputs.forza || 'no' }}
          TZ: Europe/Rome
        run: |
          mkdir -p logs state
          if [ "$MODALITA" = "sera" ]; then
            python mercato.py
            python sera.py
          else
            OGGI=$(date +%Y-%m-%d)
            ULTIMO=$(cat state/last_success.txt 2>/dev/null || echo mai)
            if [ "$ULTIMO" = "$OGGI" ] && [ "$FORZA" != "si" ]; then
              echo "pipeline già completata oggi"
            else
              EXTRA=""
              if [ "$ULTIMO" = "mai" ]; then EXTRA="--full"; else
                GIORNI=$(( ( $(date -d "$OGGI" +%s) - $(date -d "$ULTIMO" +%s) ) / 86400 ))
                if [ "$GIORNI" -gt 2 ]; then EXTRA="--full"; fi
              fi
              python daily_run.py $EXTRA
              echo "$OGGI" > state/last_success.txt
            fi
          fi
          python esporta_console.py
      - name: Salva i risultati
        if: always()
        run: |
          git config user.name "nba-totali"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dati outputs predictions state
          if git diff --cached --quiet; then echo "niente di nuovo"; else
            git commit -q -m "Totali $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M') ($MODALITA)"
            git pull -q --rebase && git push -q
          fi
        env:
          MODALITA: ${{ inputs.modalita || 'mattina' }}
